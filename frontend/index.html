<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#52402d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Filmlog">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Filmlog</title>
</head>
<body>

<div class="sprocket-strip sprocket-strip-header" aria-hidden="true"></div>

<header class="app-header">
  <a class="brand" href="#start">
    <span class="brand-mark">FILM<span class="brand-mark-accent">LOG</span></span>
    <span class="brand-sub">Analoges Aufnahmeprotokoll</span>
  </a>
  <div class="header-actions">
    <span class="net-badge" id="netBadge" hidden>offline</span>
    <button type="button" class="queue-badge" id="queueBadge" hidden></button>
    <a class="icon-btn" id="settingsBtn" href="#einstellungen" title="Einstellungen" aria-label="Einstellungen">⚙️</a>
  </div>
</header>

<main id="app"></main>

<div id="toasts" class="toasts" aria-live="polite"></div>

<div class="sprocket-strip sprocket-strip-footer" aria-hidden="true"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
